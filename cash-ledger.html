<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجل الكاش اليومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== الإعداد: ضع بيانات Supabase في السكربت بالأسفل ===== */
:root{
  --ink:#16324a;      /* حبر أزرق */
  --paper:#fbfcfd;    /* ورق الدفتر */
  --rule:#d6e2ec;     /* سطور الدفتر */
  --margin:#e4a3a3;   /* خط الهامش */
  --surplus:#1f7a4d;  /* زيادة */
  --short:#b3261e;    /* عجز */
  --muted:#6b7c8c;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:#eef3f7;color:var(--ink);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:1.45rem;margin:0;font-weight:700}
.month{display:flex;align-items:center;gap:6px}
.month button{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:#fff;color:var(--ink);font-size:18px;cursor:pointer}
.month strong{min-width:120px;text-align:center;font-weight:500}
.banner{background:#fff4d6;border:1px solid #ecd48a;color:#6b5314;padding:10px 12px;border-radius:8px;font-size:.88rem;margin-bottom:14px}

.totals{display:grid;grid-template-columns:repeat(3,1fr);background:var(--ink);color:#fff;border-radius:12px;overflow:hidden;margin-bottom:16px}
.totals div{padding:12px 10px;text-align:center}
.totals div+div{border-right:1px solid rgba(255,255,255,.15)}
.totals span{display:block;font-size:.78rem;opacity:.75}
.totals b{font-size:1.15rem;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.totals .diff b.neg{color:#ffb4ab}.totals .diff b.pos{color:#9be7b9}

form{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:16px}
form h2{font-size:1rem;margin:0 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:.85rem;color:var(--muted);display:block}
input,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--rule);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
input[type=number]{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.full{grid-column:1/-1}
.live{margin-top:10px;font-size:.92rem}
.live b{direction:ltr;display:inline-block}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--rule);flex:0 0 auto;padding:12px 16px}
.btn.del{background:#fff;color:var(--short);border:1px solid #efc4c0;flex:0 0 auto;padding:12px 16px}

/* الدفتر */
.book{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  background-image:linear-gradient(to left,transparent 46px,var(--margin) 46px,var(--margin) 47px,transparent 47px)}
.bookhead,.row{display:grid;grid-template-columns:46px 1.3fr 1fr 1fr 1fr;align-items:center}
.bookhead{font-size:.78rem;color:var(--muted);border-bottom:2px solid var(--ink);padding:8px 0}
.bookhead>*,.row>*{padding:0 8px}
.row{border-bottom:1px solid var(--rule);padding:10px 0;cursor:pointer}
.row:hover{background:#f1f6fa}
.day{text-align:center;font-weight:700;font-size:1.05rem}
.date small{display:block;color:var(--muted);font-size:.78rem}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--surplus)}.neg{color:var(--short)}
.note{grid-column:2/-1;font-size:.8rem;color:var(--muted);padding-top:2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.photos{margin-top:10px}
.photos .pick{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--rule);border-radius:8px;padding:12px;color:var(--muted);cursor:pointer;font-size:.9rem}
.photos .pick:hover{border-color:var(--ink);color:var(--ink)}
.photos input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--rule)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb button{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(22,50,74,.85);color:#fff;font-size:13px;line-height:22px;cursor:pointer}
.clip{display:inline-block;font-size:.75rem;background:#e7eef5;color:var(--ink);border-radius:10px;padding:0 7px;margin-top:2px}
.totals .all{grid-column:1/-1;border-right:0!important;border-top:1px solid rgba(255,255,255,.15);font-size:.9rem;padding:9px}
.totals .all b{font-size:1rem}
.wa{background:#1f8f55!important;color:#fff!important;border:0!important}
.viewer{position:fixed;inset:0;background:rgba(10,20,30,.9);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}
.viewer button{position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:20px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:480px){
  .bookhead,.row{grid-template-columns:40px 1.2fr 1fr 1fr 1fr;font-size:.85rem}
  .book{background-image:linear-gradient(to left,transparent 40px,var(--margin) 40px,var(--margin) 41px,transparent 41px)}
  .totals b{font-size:1rem}
}
@media print{
  body{background:#fff}
  form,.month button,.foot,.banner,.toast,.viewer{display:none!important}
  .row{cursor:default}
  .print-title{display:block!important}
}
.print-title{display:none;font-size:.9rem;color:var(--muted);margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>سجل الكاش اليومي</h1>
    <div class="month">
      <button id="next" aria-label="الشهر التالي">›</button>
      <strong id="monthLabel"></strong>
      <button id="prev" aria-label="الشهر السابق">‹</button>
    </div>
  </header>
  <div class="print-title" id="printTitle"></div>
  <div class="banner" id="demo" hidden>وضع التجربة: البيانات لا تُحفظ بعد إغلاق الصفحة. أضف بيانات Supabase في الملف لتفعيل الحفظ الدائم.</div>

  <section class="totals" aria-label="ملخص الشهر">
    <div><span>كاش النظام</span><b id="tExp">0.00</b></div>
    <div><span>مجموع الكاش الفعلي</span><b id="tAct">0.00</b></div>
    <div class="diff"><span>الفرق</span><b id="tDiff">0.00</b></div>
    <div class="all">مجموع كاش هذا الشهر: <b id="tAll">0.00</b> درهم <span id="tDays"></span></div>
  </section>

  <form id="f" autocomplete="off">
    <h2 id="formTitle">تسجيل كاش يوم</h2>
    <div class="grid">
      <label class="full">التاريخ<input type="date" id="date" required></label>
      <label>كاش النظام (حسب تقرير POS)<input type="number" id="exp" step="0.01" min="0" inputmode="decimal" required></label>
      <label>الكاش الفعلي (المعدود)<input type="number" id="act" step="0.01" min="0" inputmode="decimal" required></label>
      <label class="full">ملاحظة<textarea id="note" rows="2" placeholder="مثال: الكاشير أحمد، سبب العجز…"></textarea></label>
    </div>
    <div class="photos">
      <label class="pick" for="files">📎 أضف صور الفاتورة أو التقرير</label>
      <input type="file" id="files" accept="image/*" multiple>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="live" id="live"></div>
    <div class="actions">
      <button class="btn" type="submit" id="saveBtn">حفظ</button>
      <button class="btn del" type="button" id="delBtn" hidden>حذف</button>
      <button class="btn ghost" type="button" id="clearBtn">جديد</button>
    </div>
  </form>

  <div class="book">
    <div class="bookhead"><span class="day">اليوم</span><span>التاريخ</span><span class="num">النظام</span><span class="num">الفعلي</span><span class="num">الفرق</span></div>
    <div id="rows"></div>
  </div>

  <div class="foot">
    <span id="count" style="color:var(--muted);font-size:.88rem"></span>
    <div style="display:flex;gap:8px">
      <button class="btn ghost wa" id="waBtn" type="button">إرسال التقرير واتساب</button>
      <button class="btn ghost" id="printBtn" type="button">طباعة</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer"><button id="closeV" aria-label="إغلاق">×</button><img id="vImg" alt="صورة الفاتورة"></div>

<script>
/* ============ بيانات Supabase ============
   اتركها فارغة للتجربة، أو ضع رابط المشروع والمفتاح العام (anon key) */
const SUPABASE_URL = "https://iekotptltmkjmieauhqc.supabase.co";
const SUPABASE_KEY = "sb_publishable_35u5V1apSr2-DCpjp8ltmg_gIJzhXEN";
const TABLE = "cash_entries";
const BUCKET = "cash-receipts";
/* ======================================== */

const $ = id => document.getElementById(id);
const fmt = n => Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const signed = n => (n>0?"+":"") + fmt(n);
const days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];

let db = null, memory = [], entries = [], editingId = null;
let photos = [];   // {url} محفوظة أو {file, url} جديدة
let removed = [];  // صور محذوفة من السجل
const today = new Date(); let viewY = today.getFullYear(), viewM = today.getMonth();
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

async function init(){
  if(SUPABASE_URL && SUPABASE_KEY){
    await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } else { $("demo").hidden = false; }
  resetForm(); load();
}

async function load(){
  const from = `${viewY}-${String(viewM+1).padStart(2,"0")}-01`;
  const to = iso(new Date(viewY, viewM+1, 0));
  if(db){
    const {data,error} = await db.from(TABLE).select("*").gte("entry_date",from).lte("entry_date",to).order("entry_date",{ascending:false});
    if(error){toast("تعذّر تحميل البيانات: "+error.message);return}
    entries = data;
  } else {
    entries = memory.filter(e=>e.entry_date>=from && e.entry_date<=to).sort((a,b)=>b.entry_date.localeCompare(a.entry_date));
  }
  render();
}

function render(){
  $("monthLabel").textContent = months[viewM]+" "+viewY;
  $("printTitle").textContent = "تقرير الكاش لشهر "+months[viewM]+" "+viewY;
  let te=0, ta=0, shortDays=0;
  $("rows").innerHTML = entries.length ? entries.map(e=>{
    const d = new Date(e.entry_date+"T00:00:00"), diff = e.actual - e.expected;
    te+= +e.expected; ta+= +e.actual; if(diff<0) shortDays++;
    const cls = diff<0?"neg":diff>0?"pos":"";
    return `<div class="row" data-id="${e.id}" tabindex="0">
      <span class="day">${d.getDate()}</span>
      <span class="date">${days[d.getDay()]}<small>${e.entry_date}</small></span>
      <span class="num">${fmt(e.expected)}</span>
      <span class="num">${fmt(e.actual)}</span>
      <span class="num ${cls}">${signed(diff)}</span>
      ${(e.note||(e.images||[]).length)?`<span class="note">${(e.images||[]).length?`<span class="clip">📎 ${e.images.length} صورة</span> `:""}${(e.note||"").replace(/</g,"&lt;")}</span>`:""}
    </div>`}).join("") : `<div class="empty">لا يوجد كاش مسجّل لهذا الشهر. سجّل أول يوم من النموذج بالأعلى.</div>`;
  const td = ta-te;
  $("tExp").textContent = fmt(te); $("tAct").textContent = fmt(ta);
  $("tAll").textContent = fmt(ta); $("tDays").textContent = entries.length?`(${entries.length} يوم)`:"";
  $("tDiff").textContent = signed(td); $("tDiff").className = td<0?"neg":td>0?"pos":"";
  $("count").textContent = entries.length ? `${entries.length} يوم مسجّل` + (shortDays?`، منها ${shortDays} بعجز`:"") : "";
  document.querySelectorAll(".row").forEach(r=>{
    const open=()=>edit(r.dataset.id);
    r.onclick=open; r.onkeydown=ev=>{if(ev.key==="Enter")open()};
  });
}

function updateLive(){
  const e=parseFloat($("exp").value), a=parseFloat($("act").value);
  if(isNaN(e)||isNaN(a)){$("live").innerHTML="";return}
  const d=a-e;
  $("live").innerHTML = d===0 ? `<span class="pos">مطابق</span>` :
    `<span class="${d<0?"neg":"pos"}">${d<0?"عجز":"زيادة"}: <b>${fmt(Math.abs(d))}</b> درهم</span>`;
}

function resetForm(){
  editingId=null; $("f").reset(); $("date").value=iso(new Date()); photos=[]; removed=[]; drawThumbs();
  $("formTitle").textContent="تسجيل كاش يوم"; $("saveBtn").textContent="حفظ"; $("delBtn").hidden=true; updateLive();
}

function edit(id){
  const e = entries.find(x=>String(x.id)===String(id)); if(!e) return;
  editingId=e.id; $("date").value=e.entry_date; $("exp").value=e.expected; $("act").value=e.actual; $("note").value=e.note||"";
  photos=(e.images||[]).map(url=>({url})); removed=[]; drawThumbs();
  $("formTitle").textContent="تعديل كاش "+e.entry_date; $("saveBtn").textContent="حفظ التعديل"; $("delBtn").hidden=false;
  updateLive(); $("f").scrollIntoView({behavior:"smooth"});
}

$("f").onsubmit = async ev=>{
  ev.preventDefault();
  $("saveBtn").disabled=true; $("saveBtn").textContent="جاري الحفظ…";
  try{
  const urls=[];
  for(const p of photos){
    if(!p.file){urls.push(p.url);continue}
    if(db){
      const blob=await compress(p.file), path=`${$("date").value}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      const {error}=await db.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg"});
      if(error){toast("تعذّر رفع صورة: "+error.message);return}
      urls.push(db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
    } else urls.push(p.url);
  }
  if(db && removed.length){const paths=removed.map(u=>u.split(`/${BUCKET}/`)[1]).filter(Boolean); if(paths.length) await db.storage.from(BUCKET).remove(paths)}
  const rec = {entry_date:$("date").value, expected:+$("exp").value, actual:+$("act").value, note:$("note").value.trim(), images:urls};
  if(db){
    const q = editingId ? db.from(TABLE).update(rec).eq("id",editingId) : db.from(TABLE).upsert(rec,{onConflict:"entry_date"});
    const {error} = await q; if(error){toast("لم يتم الحفظ: "+error.message);return}
  } else {
    const i = memory.findIndex(m=> editingId ? m.id===editingId : m.entry_date===rec.entry_date);
    if(i>=0) memory[i]={...memory[i],...rec}; else memory.push({id:Date.now(),...rec});
  }
  toast(editingId?"تم حفظ التعديل":"تم الحفظ");
  const d=new Date(rec.entry_date+"T00:00:00"); viewY=d.getFullYear(); viewM=d.getMonth();
  resetForm(); load();
  } finally { $("saveBtn").disabled=false; $("saveBtn").textContent=editingId?"حفظ التعديل":"حفظ"; }
};

$("delBtn").onclick = async ()=>{
  if(!editingId || !confirm("حذف كاش هذا اليوم؟")) return;
  if(db){const {error}=await db.from(TABLE).delete().eq("id",editingId); if(error){toast("لم يتم الحذف: "+error.message);return}
    const paths=photos.filter(p=>!p.file).map(p=>p.url.split(`/${BUCKET}/`)[1]).filter(Boolean); if(paths.length) await db.storage.from(BUCKET).remove(paths);}
  else memory = memory.filter(m=>m.id!==editingId);
  toast("تم الحذف"); resetForm(); load();
};

function drawThumbs(){
  $("thumbs").innerHTML = photos.map((p,i)=>`<div class="thumb"><img src="${p.url}" data-i="${i}" alt="صورة ${i+1}"><button type="button" data-rm="${i}" aria-label="إزالة الصورة">×</button></div>`).join("");
  $("thumbs").querySelectorAll("img").forEach(im=>im.onclick=()=>openViewer(photos[im.dataset.i].url));
  $("thumbs").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const p=photos.splice(+b.dataset.rm,1)[0]; if(!p.file) removed.push(p.url); drawThumbs()});
}
$("files").onchange = ev=>{
  for(const file of ev.target.files) photos.push({file, url:URL.createObjectURL(file)});
  ev.target.value=""; drawThumbs();
};
// تصغير الصورة قبل الرفع لتوفير المساحة
function compress(file){return new Promise(res=>{
  const img=new Image(); img.onload=()=>{
    const s=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); c.toBlob(b=>res(b||file),"image/jpeg",.8);
  }; img.onerror=()=>res(file); img.src=URL.createObjectURL(file);
})}
function openViewer(url){$("vImg").src=url; $("viewer").classList.add("open")}
$("closeV").onclick=()=>$("viewer").classList.remove("open");
$("viewer").onclick=ev=>{if(ev.target.id==="viewer")$("viewer").classList.remove("open")};

// تقرير واتساب الشهري
$("waBtn").onclick = ()=>{
  if(!entries.length){toast("لا يوجد كاش مسجّل لهذا الشهر");return}
  let te=0,ta=0; const lines=[...entries].reverse().map(e=>{
    const d=new Date(e.entry_date+"T00:00:00"), diff=e.actual-e.expected; te+=+e.expected; ta+=+e.actual;
    return `${e.entry_date} (${days[d.getDay()]})\nالنظام: ${fmt(e.expected)} | الفعلي: ${fmt(e.actual)} | ${diff===0?"مطابق":(diff<0?"عجز ":"زيادة ")+fmt(Math.abs(diff))}${e.note?`\nملاحظة: ${e.note}`:""}`;
  });
  const td=ta-te, shortDays=entries.filter(e=>e.actual<e.expected).length;
  const msg=`*تقرير الكاش — ${months[viewM]} ${viewY}*\n\n${lines.join("\n\n")}\n\n————————\nعدد الأيام: ${entries.length}\nمجموع كاش النظام: ${fmt(te)} درهم\n*مجموع الكاش الفعلي: ${fmt(ta)} درهم*\nالفرق: ${signed(td)} درهم${shortDays?`\nأيام العجز: ${shortDays}`:""}`;
  window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
};

$("clearBtn").onclick = resetForm;
$("exp").oninput = $("act").oninput = updateLive;
$("prev").onclick = ()=>{viewM--; if(viewM<0){viewM=11;viewY--} load()};
$("next").onclick = ()=>{viewM++; if(viewM>11){viewM=0;viewY++} load()};
$("printBtn").onclick = ()=>window.print();
init();
</script>
</body>
</html>
